spring.datasource.url=jdbc:h2:mem:paybridge-test;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/migration/V2__seed_settlement_account.sql,classpath:db/seed-dev/V3__seed_demo_accounts.sql,classpath:db/migration/V8__seed_fee_and_tax_accounts.sql
paybridge.reconciliation.enabled=false